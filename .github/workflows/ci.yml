name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # JDK 17 — matches JavaVersion.VERSION_17 and jvmTarget = "17" in build.gradle.kts
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Caches Gradle home and build outputs; uses the wrapper version from
      # gradle/wrapper/gradle-wrapper.properties (Gradle 9.3.0) — no version override.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # No ktlint/detekt/spotless plugin found in build.gradle.kts or
      # libs.versions.toml — lint/format step intentionally omitted.

      - name: Run unit tests
        run: bash ./gradlew testDebugUnitTest

      - name: Assemble debug APK
        run: bash ./gradlew assembleDebug

      - name: Upload test results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/build/test-results/**
            **/build/reports/**
          if-no-files-found: ignore
          retention-days: 7
