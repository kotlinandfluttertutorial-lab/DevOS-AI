name: Release

# Triggered on version tags (e.g. v1.0.0, v0.2.3-rc1).
# Builds and signs the release AAB using GitHub Actions secrets — keys are NEVER committed.
on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false   # never cancel a release build

jobs:
  unit-tests:
    name: Unit Tests (pre-release gate)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: bash ./gradlew testDebugUnitTest

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-results
          path: '**/build/test-results/**/*.xml'
          if-no-files-found: ignore
          retention-days: 14

  release-build:
    name: Build & Sign Release AAB
    needs: unit-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Decode the base64-encoded keystore from GitHub Secrets into a temp file.
      # IMPORTANT: The actual keystore file is never committed to the repository.
      # All signing credentials are stored exclusively as GitHub Actions secrets:
      #   KEYSTORE_FILE    — base64-encoded .jks / .keystore file
      #   KEY_ALIAS        — key alias inside the keystore
      #   KEY_PASSWORD     — key password
      #   STORE_PASSWORD   — keystore password
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_FILE }}" | base64 --decode > ${{ runner.temp }}/release.jks

      - name: Build signed release AAB
        run: |
          bash ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=${{ runner.temp }}/release.jks \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }} \
            -Pandroid.injected.signing.store.password=${{ secrets.STORE_PASSWORD }}

      # Remove the keystore immediately after signing
      - name: Clean up keystore
        if: always()
        run: rm -f ${{ runner.temp }}/release.jks

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: release-aab-${{ github.ref_name }}
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
