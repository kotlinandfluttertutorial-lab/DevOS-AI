[versions]
# Build
agp                  = "8.7.0"
kotlin               = "2.0.21"
ksp                  = "2.0.21-1.0.27"

# AndroidX
core-ktx             = "1.13.1"
lifecycle            = "2.8.6"
activity-compose     = "1.9.3"
splash-screen        = "1.0.1"
work-manager         = "2.9.1"
datastore            = "1.1.1"
security-crypto      = "1.1.0-alpha06"
browser              = "1.8.0"
window               = "1.3.0"

# Compose
compose-bom          = "2024.09.03"
navigation-compose   = "2.8.3"
hilt-navigation      = "1.2.0"

# DI
hilt                 = "2.52"

# Database
room                 = "2.6.1"

# Network
retrofit             = "2.11.0"
okhttp               = "4.12.0"
okhttp-sse           = "4.12.0"

# Image
coil                 = "2.7.0"

# Coroutines
coroutines           = "1.9.0"

# JSON
moshi                = "1.15.1"
kotlinx-serialization = "1.7.3"

# Markdown
commonmark           = "0.22.0"

# Test
junit4               = "4.13.2"
junit5               = "5.11.3"
mockk                = "1.13.12"
turbine              = "1.2.0"
espresso             = "3.6.1"
compose-test-manifest = "1.7.4"
mockwebserver        = "4.12.0"
benchmark            = "1.3.2"

[libraries]
# Kotlin
kotlin-stdlib           = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib", version.ref = "kotlin" }
kotlinx-coroutines      = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization   = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

# AndroidX Core
androidx-core-ktx       = { group = "androidx.core", name = "core-ktx", version.ref = "core-ktx" }
androidx-lifecycle-vm   = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose" }
androidx-splash         = { group = "androidx.core", name = "core-splashscreen", version.ref = "splash-screen" }
androidx-work           = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work-manager" }
androidx-datastore      = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "security-crypto" }
androidx-window         = { group = "androidx.window", name = "window", version.ref = "window" }
androidx-browser        = { group = "androidx.browser", name = "browser", version.ref = "browser" }

# Compose BOM
compose-bom             = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-ui              = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics     = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling      = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-foundation      = { group = "androidx.compose.foundation", name = "foundation" }
compose-material3       = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons  = { group = "androidx.compose.material", name = "material-icons-extended" }
compose-animation       = { group = "androidx.compose.animation", name = "animation" }
compose-adaptive        = { group = "androidx.compose.material3.adaptive", name = "adaptive" }

# Navigation
navigation-compose      = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation-compose" }

# Hilt
hilt-android            = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler           = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-work               = { group = "androidx.hilt", name = "hilt-work", version = "1.2.0" }
hilt-work-compiler      = { group = "androidx.hilt", name = "hilt-compiler", version = "1.2.0" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hilt-navigation" }

# Room
room-runtime            = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx                = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler           = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-paging             = { group = "androidx.room", name = "room-paging", version.ref = "room" }

# Network
retrofit                = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-moshi          = { group = "com.squareup.retrofit2", name = "converter-moshi", version.ref = "retrofit" }
okhttp                  = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging          = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
okhttp-sse              = { group = "com.squareup.okhttp3", name = "okhttp-sse", version.ref = "okhttp-sse" }

# JSON
moshi                   = { group = "com.squareup.moshi", name = "moshi-kotlin", version.ref = "moshi" }
moshi-codegen           = { group = "com.squareup.moshi", name = "moshi-kotlin-codegen", version.ref = "moshi" }

# Image
coil                    = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }

# Markdown
commonmark              = { group = "org.commonmark", name = "commonmark", version.ref = "commonmark" }

# Paging
paging-runtime          = { group = "androidx.paging", name = "paging-runtime-ktx", version = "3.3.2" }
paging-compose          = { group = "androidx.paging", name = "paging-compose", version = "3.3.2" }

# Testing — Unit
test-junit4             = { group = "junit", name = "junit", version.ref = "junit4" }
test-junit5-api         = { group = "org.junit.jupiter", name = "junit-jupiter-api", version.ref = "junit5" }
test-junit5-engine      = { group = "org.junit.jupiter", name = "junit-jupiter-engine", version.ref = "junit5" }
test-junit5-launcher    = { group = "org.junit.platform", name = "junit-platform-launcher", version = "1.11.3" }
test-mockk              = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
test-turbine            = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
test-coroutines         = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
test-mockwebserver      = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "mockwebserver" }
test-assertk            = { group = "com.willowtreeapps.assertk", name = "assertk", version = "0.28.1" }

# Testing — Android
test-android-junit      = { group = "androidx.test.ext", name = "junit", version = "1.2.1" }
test-espresso           = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
test-compose-junit4     = { group = "androidx.compose.ui", name = "ui-test-junit4" }
test-compose-manifest   = { group = "androidx.compose.ui", name = "ui-test-manifest", version.ref = "compose-test-manifest" }
test-hilt               = { group = "com.google.dagger", name = "hilt-android-testing", version.ref = "hilt" }
test-room               = { group = "androidx.room", name = "room-testing", version.ref = "room" }
test-benchmark          = { group = "androidx.benchmark", name = "benchmark-junit4", version.ref = "benchmark" }

[bundles]
compose = ["compose-ui", "compose-ui-graphics", "compose-foundation", "compose-material3",
           "compose-material-icons", "compose-animation", "compose-ui-tooling-preview"]
room    = ["room-runtime", "room-ktx", "room-paging"]
network = ["retrofit", "retrofit-moshi", "okhttp", "okhttp-logging", "okhttp-sse"]
test-unit = ["test-junit5-api", "test-mockk", "test-turbine", "test-coroutines", "test-assertk"]
test-android = ["test-android-junit", "test-espresso", "test-compose-junit4", "test-hilt"]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library     = { id = "com.android.library", version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
hilt                = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp                 = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room                = { id = "androidx.room", version.ref = "room" }
