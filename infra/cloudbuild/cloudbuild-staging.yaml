steps:
  # Step 1: Run tests
  - name: 'python:3.12-slim'
    id: 'run-tests'
    entrypoint: bash
    args:
      - -c
      - |
        cd backend
        pip install -q poetry
        poetry install --no-root
        poetry run pytest tests/ -v --tb=short

  # Step 2: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    args:
      - build
      - -t
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/devos-ai/api:${SHORT_SHA}'
      - -t
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/devos-ai/api:staging-latest'
      - ./backend
    waitFor: ['run-tests']

  # Step 3: Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    args:
      - push
      - --all-tags
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/devos-ai/api'
    waitFor: ['build-image']

  # Step 4: Deploy to Cloud Run (staging)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-staging'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - devos-ai-api-staging
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/devos-ai/api:${SHORT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --service-account=devos-ai-sa@${PROJECT_ID}.iam.gserviceaccount.com
      - --allow-unauthenticated
      - --port=8000
      - --memory=512Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=10
      - --concurrency=80
      - --timeout=300
    waitFor: ['push-image']

substitutions:
  _REGION: us-central1

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

# Triggers: auto-deploy to staging on every push to 'main'
# Configure this trigger in Cloud Build console or via gcloud:
#   gcloud builds triggers create github \
#     --repo-name=devos-ai \
#     --branch-pattern=^main$ \
#     --build-config=infra/cloudbuild/cloudbuild-staging.yaml
